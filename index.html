<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GameLife Arcade</title>
  <style>
    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #111; color: #eee; }
    header {
      background: #222; padding: 10px; text-align: center; font-size: 1.4rem;
      font-weight: bold; color: #00f7ff; box-shadow: 0 2px 10px #000;
    }
    #intro-screen {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: #000d1a; color: #00f7ff;
      display: flex; justify-content: center; align-items: center; flex-direction: column;
      z-index: 1000; font-size: 2rem;
    }
    #intro-screen button {
      margin-top: 20px; padding: 10px 20px; font-size: 1.2rem;
      background: #00f7ff; color: #000; border: none; border-radius: 10px; cursor: pointer;
    }
    main { display: none; text-align: center; padding: 20px; }

    .game-buttons {
      margin-top: 15px;
      display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
    }

    .game-buttons button {
      padding: 8px 14px; font-size: 0.9rem;
      background: #333; color: #fff; border: none; border-radius: 6px;
      cursor: pointer; transition: 0.3s;
    }

    .game-buttons button:hover {
      background: #00f7ff; color: #000;
    }

    section { display: none; margin-top: 20px; animation: fadeIn 0.5s; font-size: 0.95rem; }

    .emoji-face {
      font-size: 3rem; text-align: center; transition: transform 0.3s ease;
    }

    .rps-buttons {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      justify-content: center; max-width: 250px; margin: 20px auto;
    }

    .rps-buttons button {
      padding: 10px; font-size: 1.1rem; border-radius: 5px;
      background: #333; color: #fff; border: none; cursor: pointer;
      transition: background 0.2s;
    }

    .rps-buttons button:hover { background: #00f7ff; color: #000; }
    .rps-buttons .full { grid-column: span 2; }

    .board {
      display: grid; grid-template-columns: repeat(3, 80px); gap: 5px;
      justify-content: center; margin: 20px auto;
    }

    .cell {
      width: 80px; height: 80px; background: #333; font-size: 2rem;
      display: flex; align-items: center; justify-content: center;
      border-radius: 5px; cursor: pointer;
    }

    .glow-x { background: #0f0 !important; box-shadow: 0 0 10px #0f0, 0 0 20px #0f0; }
    .glow-o { background: #f00 !important; box-shadow: 0 0 10px #f00, 0 0 20px #f00; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    #ad-container {
      position: fixed;
      bottom: 10px;
      right: 10px;
      width: 160px;
      height: 300px;
      z-index: 999;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 10px #00f7ff88;
    }
    #rotate-ad-btn {
      position: fixed;
      bottom: 320px;
      right: 10px;
      z-index: 1000;
      padding: 5px 10px;
      font-size: 0.8rem;
      background: #00f7ff; color: #000; border: none; border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div id="intro-screen">
  <div>✨ Welcome to GameLife ✨</div>
  <button onclick="startApp()">Start Game</button>
</div>

<header>🎮 Welcome to GameLife</header>

<main>
  <div class="game-buttons">
    <button onclick="showGame('rps')">🪨 Rock Paper Scissors</button>
    <button onclick="showGame('ttt')">❌ Tic Tac Toe</button>
  </div>

  <!-- RPS Section -->
  <section id="rps">
    <h2>Rock Paper Scissors</h2>
    <div id="bot-emoji" class="emoji-face">🤖</div>
    <p id="rps-intro">You're about to challenge our AI bot. Make your move!</p>
    <div class="rps-buttons">
      <button onclick="playRPS('rock')">🪨 Rock</button>
      <button onclick="playRPS('paper')">📄 Paper</button>
      <button class="full" onclick="playRPS('scissors')">✂️ Scissors</button>
    </div>
    <p id="rps-result"></p>
    <div id="rps-score" style="text-align:center; margin-top:10px;"></div>
  </section>

  <!-- Tic Tac Toe Section -->
  <section id="ttt">
    <h2>Tic Tac Toe</h2>
    <label>Bot Level:
      <select id="botLevel">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
    </label>
    <div class="board" id="ttt-board"></div>
    <p id="ttt-status"></p>
  </section>
</main>

<!-- Ad Rotate Button -->
<button id="rotate-ad-btn" onclick="rotateAd()">🔁 Rotate Ad</button>

<!-- Ad Container -->
<div id="ad-container">
  <script type="text/javascript">
    atOptions = {
      'key' : 'd58bfc795dcf19c2b28cfe9fd617715f',
      'format' : 'iframe',
      'height' : 300,
      'width' : 160,
      'params' : {}
    };
  </script>
  <script type="text/javascript" src="//www.highperformanceformat.com/d58bfc795dcf19c2b28cfe9fd617715f/invoke.js"></script>
</div>

<script>
function startApp() {
  document.getElementById('intro-screen').style.display = 'none';
  document.querySelector('main').style.display = 'block';
  showGame('rps');
  renderBoard();
}
function showGame(id) {
  document.querySelectorAll('section').forEach(s => s.style.display = 'none');
  document.getElementById(id).style.display = 'block';
  if(id === 'ttt') resetTTT();
}

let rpsScore = { win: 0, lose: 0, draw: 0 };
function playRPS(playerMove) {
  const moves = ['rock','paper','scissors'];
  const botMove = moves[Math.floor(Math.random()*3)];
  const result = getRPSResult(playerMove, botMove);
  document.getElementById('rps-result').textContent = `You: ${playerMove} | Bot: ${botMove} → ${result}`;
  document.getElementById('bot-emoji').textContent = result === 'Win' ? '😁' : result === 'Lose' ? '😢' : '😐';
  updateRPSScore(result);
}
function getRPSResult(p, b) {
  if (p === b) return 'Draw';
  if ((p==='rock' && b==='scissors') || (p==='scissors' && b==='paper') || (p==='paper' && b==='rock')) return 'Win';
  return 'Lose';
}
function updateRPSScore(result) {
  if (result === 'Win') rpsScore.win++;
  else if (result === 'Lose') rpsScore.lose++;
  else rpsScore.draw++;
  document.getElementById('rps-score').textContent = `Wins: ${rpsScore.win} | Losses: ${rpsScore.lose} | Draws: ${rpsScore.draw}`;
}

let board = [], currentPlayer = 'X', tttActive = true;
function renderBoard() {
  const boardEl = document.getElementById('ttt-board');
  boardEl.innerHTML = '';
  board.forEach((val, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.textContent = val;
    cell.onclick = () => makeMove(i);
    boardEl.appendChild(cell);
  });
}
function resetTTT() {
  board = Array(9).fill('');
  currentPlayer = 'X';
  tttActive = true;
  document.getElementById('ttt-status').textContent = '';
  renderBoard();
}
function makeMove(i) {
  if (!tttActive || board[i]) return;
  board[i] = currentPlayer;
  renderBoard();
  if (checkWin(currentPlayer)) {
    document.getElementById('ttt-status').textContent = `${currentPlayer} wins!`;
    highlightWinner(currentPlayer);
    tttActive = false;
    setTimeout(resetTTT, 2000);
    return;
  } else if (!board.includes('')) {
    document.getElementById('ttt-status').textContent = `It's a draw!`;
    tttActive = false;
    setTimeout(resetTTT, 2000);
    return;
  }
  currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
  if (currentPlayer === 'O') setTimeout(botMove, 500);
}
function botMove() {
  const level = document.getElementById('botLevel').value;
  let move = level === 'easy' ? randomBotMove() : smartBotMove();
  if (move !== null) makeMove(move);
}
function randomBotMove() {
  const empty = board.map((v, i) => v === '' ? i : null).filter(i => i !== null);
  return empty.length ? empty[Math.floor(Math.random() * empty.length)] : null;
}
function smartBotMove() {
  for (let i = 0; i < 9; i++) {
    if (board[i] === '') {
      board[i] = 'O';
      if (checkWin('O')) { board[i] = ''; return i; }
      board[i] = '';
    }
  }
  for (let i = 0; i < 9; i++) {
    if (board[i] === '') {
      board[i] = 'X';
      if (checkWin('X')) { board[i] = ''; return i; }
      board[i] = '';
    }
  }
  return randomBotMove();
}
function checkWin(p) {
  const wins = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];
  return wins.some(combo => combo.every(i => board[i] === p));
}
function highlightWinner(p) {
  const boardEl = document.getElementById('ttt-board').children;
  const glowClass = p === 'X' ? 'glow-x' : 'glow-o';
  board.forEach((val, i) => {
    if (val === p) boardEl[i].classList.add(glowClass);
  });
}

// Rotate ad
let rotated = false;
function rotateAd() {
  const ad = document.getElementById('ad-container');
  rotated = !rotated;
  ad.style.transform = rotated ? 'rotate(-45deg)' : 'rotate(0)';
  ad.style.transformOrigin = 'bottom right';
}
</script>
</body>
